{% extends 'base.html' %}

{% block title %}Edit Program{% endblock %}

{% block navigation %}
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'view_programs' %}">Back to Programs</a>
{% endblock %}

{% block content %}
    <h1>{% if form.instance.pk %}Edit{% else %}Add New{% endif %} Program</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn">Save Changes</button>
    </form>
{% endblock %}
